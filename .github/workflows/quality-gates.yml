name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Python 3.13 and locked dependencies
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked

      - name: Check lint and formatting
        working-directory: backend
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Generate OpenAPI specification
        working-directory: backend
        env:
          APP_ENV: dev
          APP_NAME: Squicrates
          APP_HOST: 127.0.0.1
          APP_PORT: "8000"
          CORS_ORIGINS: '["http://localhost:5173"]'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret-key-for-backend-tests
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: make gen

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: uv run --locked pytest tests/api -q --cov=app --cov-report=xml:coverage.xml

      - name: Run backend integration tests
        working-directory: backend
        env:
          APP_ENV: development
          APP_NAME: test
          APP_HOST: 127.0.0.1
          APP_PORT: "8000"
          CORS_ORIGINS: "[]"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-jwt-secret-key-for-backend-tests
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: uv run --locked pytest tests/integration -q

      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: backend/openapi.json
          if-no-files-found: error

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan pull request or pushed commits with Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide a valid head commit SHA."
            exit 1
          fi

          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || "${BASE_SHA}" =~ ^0+$ ]]; then
            if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            else
              docker run --rm --network none \
                --user "$(id -u):$(id -g)" \
                --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" \
                --workdir "${GITHUB_WORKSPACE}" \
                ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
                dir --redact --no-banner "${GITHUB_WORKSPACE}"
              exit 0
            fi
          fi

          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide a valid base commit SHA."
            exit 1
          fi

          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" \
            --workdir "${GITHUB_WORKSPACE}" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact --no-banner --log-opts="--all ${BASE_SHA}..${HEAD_SHA}" "${GITHUB_WORKSPACE}"
