name: API Docs Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  api-docs:
    # Pin to full commit SHA (Sonar / supply-chain); comment is the release tag.
    uses: dytsou/fastAPI-docs-pages/.github/workflows/publish.yml@2343110e59872afd6d9f886d60522e85c55a7514 # v1.0.5
    with:
      # publish.yml only runs a shell setup (no setup-uv action).
      setup-command: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        export PATH="${HOME}/.local/bin:${PATH}"
        cd backend && uv python install 3.13 && uv sync --locked --no-build
      # Run the exporter from the workflow workspace (PR/head has the script) against
      # each tree's app code — origin/main may not have scripts/export_openapi.py yet.
      export-command: |
        PYTHONPATH="$API_DOCS_TREE_ROOT/backend" \
          uv run --locked --project "$API_DOCS_WORKSPACE/backend" \
          python "$API_DOCS_WORKSPACE/backend/scripts/export_openapi.py" \
          -o "$API_DOCS_TREE_ROOT/backend/openapi.json"
      openapi-path: backend/openapi.json
      title: SocratesBot API
      renderer: both
