name: API Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "backend/app/api/**"
      - "backend/app/schemas/**"
      - "backend/app/main.py"
      - "backend/scripts/export_openapi.py"
      - ".github/workflows/api-docs-pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "backend/app/api/**"
      - "backend/app/schemas/**"
      - "backend/app/main.py"
      - "backend/scripts/export_openapi.py"
      - ".github/workflows/api-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write
  actions: read

jobs:
  api-docs:
    uses: dytsou/fastAPI-docs-pages/.github/workflows/publish.yml@194257efb94b2e638b41f242e13ead32f6045b8e # v1.3.1
    with:
      setup-command: |
        cd backend && uv python install 3.13 && uv sync --locked --no-build
      # Each tree uses its own exporter + lockfile (main ships export_openapi.py).
      export-command: |
        tree_backend="$API_DOCS_TREE_ROOT/backend"
        (
          cd "$tree_backend"
          uv python install 3.13
          uv sync --locked --no-build
        )
        PYTHONPATH="$tree_backend" \
          uv run --locked --project "$tree_backend" \
          python "$tree_backend/scripts/export_openapi.py" \
          -o "$tree_backend/openapi.json"
      openapi-path: backend/openapi.json
      title: SocratesBot API
      renderer: both
