name: API Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "backend/app/api/**"
      - "backend/app/schemas/**"
      - "backend/app/main.py"
      - "backend/scripts/export_openapi.py"
      - ".github/workflows/api-docs-pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "backend/app/api/**"
      - "backend/app/schemas/**"
      - "backend/app/main.py"
      - "backend/scripts/export_openapi.py"
      - ".github/workflows/api-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

jobs:
  api-docs:
    # Pin to full commit SHA (Sonar / supply-chain); comment is the release tag.
    # Bumped after release of fastAPI-docs-pages v1.1.1.
    uses: dytsou/fastAPI-docs-pages/.github/workflows/publish.yml@9b702d641ba4465ab307fab82e2d9960b37e6a72 # v1.3.0
    with:
      # publish.yml installs uv via SHA-pinned astral-sh/setup-uv.
      setup-command: |
        cd backend && uv python install 3.13 && uv sync --locked --no-build
      # Each tree uses its own exporter + lockfile (main ships export_openapi.py).
      export-command: |
        tree_backend="$API_DOCS_TREE_ROOT/backend"
        (
          cd "$tree_backend"
          uv python install 3.13
          uv sync --locked --no-build
        )
        PYTHONPATH="$tree_backend" \
          uv run --locked --project "$tree_backend" \
          python "$tree_backend/scripts/export_openapi.py" \
          -o "$tree_backend/openapi.json"
      openapi-path: backend/openapi.json
      title: SocratesBot API
      renderer: both
