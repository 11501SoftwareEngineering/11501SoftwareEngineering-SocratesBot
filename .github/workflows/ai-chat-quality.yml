name: AI Chat Quality

on:
  pull_request:
    paths:
      - "ai/**"
      - "scripts/chat.mjs"
      - "chat.config.json"
      - "package.json"
      - ".github/workflows/ai-chat-quality.yml"
  push:
    branches: [main]
    paths:
      - "ai/**"
      - "scripts/chat.mjs"
      - "chat.config.json"
      - "package.json"
      - ".github/workflows/ai-chat-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run build
      - name: Test conversation API and streaming without provider credentials
        run: npm test
