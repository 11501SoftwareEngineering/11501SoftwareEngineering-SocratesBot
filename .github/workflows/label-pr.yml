name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    name: Apply repository path labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels for changed paths
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
