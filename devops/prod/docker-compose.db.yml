services:
  db:
    image: postgres:18-alpine
    container_name: squicrates-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "production"
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network-prod
    ports:
      - 127.0.0.1:5432:5432
    secrets:
          - db_password
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # 唯讀根檔案系統 (掛載必要暫存區)，資料在記憶體，容器關掉就沒了
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:8-alpine
    container_name: squicrates-redis-prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network-prod
    ports:
      - 127.0.0.1:6379:6379
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data_prod:
  redis_data_prod:


networks:
  db-network-prod:
    name: db-network-prod
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    # 固定網段,供 nginx 的 set_real_ip_from 精準信任 cloudflared 所在網段
    ipam:
      config:
        - subnet: 10.200.200.0/24

secrets:
  db_password:
    file: ./db_default_user_password.txt
    