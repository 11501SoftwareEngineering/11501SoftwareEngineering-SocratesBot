services:
  backend:
    image: socrates-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: socrates-backend
    restart: unless-stopped
    env_file:
      - .env.backend
    ports:
      - 127.0.0.1:8000:8000
    security_opt:
      - no-new-privileges:true
    networks:
      - db-network-prod

networks:
  db-network-prod:
    external: true
