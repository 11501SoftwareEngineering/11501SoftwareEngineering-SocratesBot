services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: socrates-backend:latest
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: squicrates-redis-prod
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      start_period: 30s
    networks:
      db-network-prod:
        aliases:
          - socrates-backend
    security_opt:
      - no-new-privileges:true

networks:
  db-network-prod:
    external: true
