services:
  nginx:
    image: nginx:alpine
    container_name: socrates-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - db-network-prod

networks:
  db-network-prod:
    external: true
