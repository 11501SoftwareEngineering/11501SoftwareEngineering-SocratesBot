user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 1. 隱藏 Nginx 版本號
  server_tokens off;

  # 2. Rate Limiting 限流區塊 (依據單一來源 IP 計算)
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
  limit_req_status 429;

  # 3. 正確取得 Cloudflare 的訪客真實 IP
  # For squicrates.ntnu.cc, since squicrates.ssr.ntnu.cc needs VPN
  # Cloudflare Tunnel 封包轉發來自本機 127.0.0.1 (若 cloudflared 與 nginx 同台機器)
  set_real_ip_from 127.0.0.1;
  # 也可以指定本機網段或 docker 網段
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  # 告訴 Nginx 從 CF-Connecting-IP 取得使用者真正的 IP
  real_ip_header CF-Connecting-IP;

  server {
    listen 80;
    server_name squicrates.ntnu.cc squicrates.ssr.ntnu.cc;

    # 限制上傳大小 (防止大檔案 DoS)
    client_max_body_size 10M;

    # 資安 Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy 通用轉發 Header
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A. 前端服務
    root /usr/share/nginx/html;
    index index.html;

    # 1. 前端靜態網頁與 SPA 路由處理
    location / {
      limit_req zone=general_limit burst=50 nodelay;
      try_files $uri $uri/ /index.html;
    }

    # 2. 靜態資源快取優化
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # B. 後端 API 服務
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://socrates-backend:8000;
    }

    # C. 敏感操作嚴格限流 (例如登入)
    location /api/v1/auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://socrates-backend:8000;
    }

    # D. SSE / 串流 API 專用設定
    location ~ ^/api/v1/sessions/[^/]+/messages/stream$ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://socrates-backend:8000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # E. WebSocket 專用設定
    location /ws/ {
      proxy_pass http://socrates-backend:8000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_read_timeout 3600s;
    }
  }
}