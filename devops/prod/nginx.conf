user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. 隱藏 Nginx 版本號
    server_tokens off;

    # 2. Rate Limiting 限流區塊 (依據單一來源 IP 計算)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # 限制上傳大小 (防止大檔案 DoS)
        client_max_body_size 10M;

        # 資安 Header (已移除過時的 X-XSS-Protection)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Proxy 通用轉發 Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A. 前端服務 (localhost:3000)
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://frontend:3000;
        }

        # B. 後端 API 服務 (localhost:8000)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000;
        }

        # C. 敏感操作嚴格限流 (例如登入)
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend:8000;
        }

        # D. SSE / 串流 API 專用設定
        location ~ ^/api/v1/sessions/[^/]+/messages/stream$ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://backend:8000;

            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # E. WebSocket 專用設定
        location /ws/ {
            proxy_pass http://backend:8000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
